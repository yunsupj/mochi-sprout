[project]
name = "mochi-sprout"
version = "0.1.0"
description = "Small, reproducible robotics learning experiments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mujoco==3.17.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
